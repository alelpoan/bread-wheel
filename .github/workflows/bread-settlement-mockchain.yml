name: Bread Wheel experimental settlement MockChain
on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'miden/masm/settlement_v1.masm'
      - 'miden/tests/wheel_settlement_v1_test.rs'
      - '.github/workflows/bread-settlement-mockchain.yml'
jobs:
  settlement:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-09-01
      - uses: Swatinem/rust-cache@v2
      - uses: actions/checkout@v4
        with:
          repository: guelowrd/gq-thegamenotthemagazine
          ref: 32854f907f305a6df49041fbc8ed4432e8ffafb0
          path: geoquizz-reference
      - name: Install experimental settlement module and test
        run: |
          cp miden/masm/settlement_v1.masm geoquizz-reference/masm/bread_settlement_v1.masm
          cp miden/tests/wheel_settlement_v1_test.rs geoquizz-reference/integration/tests/wheel_settlement_v1_test.rs
      - name: Compile MASM and execute MockChain scenarios
        working-directory: geoquizz-reference/integration
        run: cargo +nightly-2026-09-01 test --test wheel_settlement_v1_test -- --nocapture
