name: Bread Wheel consolidated reference checks (NOT mainnet authorization)
on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'miden/protocol/**'
      - 'miden/settlement/**'
      - 'miden/fairness/**'
      - 'scripts/test-reference.mjs'
      - '.github/workflows/bread-one-shot-check.yml'
jobs:
  reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/test-reference.mjs
