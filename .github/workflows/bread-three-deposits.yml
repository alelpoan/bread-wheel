name: Bread Wheel three independent deposits (UNSAFE precommitted winner)
on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'miden/tests/wheel_multiplayer_gate_test.rs'
      - '.github/workflows/bread-three-deposits.yml'
jobs:
  three-deposits:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-09-01
      - uses: Swatinem/rust-cache@v2
      - uses: actions/checkout@v4
        with:
          repository: guelowrd/gq-thegamenotthemagazine
          ref: 32854f907f305a6df49041fbc8ed4432e8ffafb0
          path: geoquizz-reference
      - name: Copy module and test
        run: |
          cp miden/masm/settlement_v1.masm geoquizz-reference/masm/bread_settlement_v1.masm
          cp miden/tests/wheel_multiplayer_gate_test.rs geoquizz-reference/integration/tests/wheel_multiplayer_gate_test.rs
      - name: Execute independent deposit tests
        working-directory: geoquizz-reference/integration
        run: cargo +nightly-2026-09-01 test --test wheel_multiplayer_gate_test -- --nocapture
