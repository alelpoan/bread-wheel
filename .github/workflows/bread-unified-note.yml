name: Bread Wheel unified note MockChain gate (unsafe prototype)
on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'miden/tests/wheel_unified_note_test.rs'
      - 'miden/tests/wheel_unified_multiplayer_test.rs'
      - '.github/workflows/bread-unified-note.yml'
      - 'miden/masm/settlement_v1.masm'
jobs:
  unified-note:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-09-01
      - uses: Swatinem/rust-cache@v2
      - uses: actions/checkout@v4
        with:
          repository: guelowrd/gq-thegamenotthemagazine
          ref: 32854f907f305a6df49041fbc8ed4432e8ffafb0
          path: geoquizz-reference
      - name: Install module and tests
        run: |
          cp miden/masm/settlement_v1.masm geoquizz-reference/masm/bread_settlement_v1.masm
          cp miden/tests/wheel_unified_note_test.rs geoquizz-reference/integration/tests/wheel_unified_note_test.rs
          cp miden/tests/wheel_unified_multiplayer_test.rs geoquizz-reference/integration/tests/wheel_unified_multiplayer_test.rs
      - name: Execute unified note scenarios
        working-directory: geoquizz-reference/integration
        run: |
          cargo +nightly-2026-09-01 test --test wheel_unified_note_test -- --nocapture
          cargo +nightly-2026-09-01 test --test wheel_unified_multiplayer_test -- --nocapture
